name: pocket_change
description: "A Flutter digital cash ledger application with on-device AI physical banknote scanning."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local SQLite Persistence (Android Native)
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Receipt Photo Capture & Banknote Imaging
  image_picker: ^1.1.2

  # On-Device Local ML / AI Text & Pattern Recognition
  google_mlkit_text_recognition: ^1.0.2
  google_mlkit_commons: ^1.0.2

  # Transaction IDs & Utilities
  uuid: ^4.5.1
  intl: ^0.20.0

  # Backup Portability (Export & Import)
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # UI Icons
  cupertino_icons: ^1.0.8
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Headless SQLite Test Engine (Linux Host Testing)
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  # Asset directory for static assets if needed
  # assets:
  #   - assets/icons/
